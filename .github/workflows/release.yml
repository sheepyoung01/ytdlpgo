name: Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          wails build -platform windows/amd64 -nsis -installscope user -clean -ldflags "-X main.appVersion=$version"
          Move-Item "build/bin/ytdlpgo-amd64-installer.exe" "build/bin/ytdlpgo-$version-windows-amd64-installer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/bin/*windows-amd64-installer.exe
          if-no-files-found: error

  macos:
    name: macOS Installers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build macOS app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          wails build -platform darwin/universal -clean -ldflags "-X main.appVersion=$VERSION"

      - name: Package DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          mkdir -p build/dmg build/dist
          cp -R build/bin/ytdlpgo.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "ytdlpgo" -srcfolder build/dmg -ov -format UDZO \
            "build/dist/ytdlpgo-${VERSION}-macos-universal.dmg"
          rm -rf build/dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: build/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
