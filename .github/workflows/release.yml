name: Release Installers

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Resolve latest tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      version: ${{ steps.latest.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read latest version tag
        id: latest
        shell: bash
        run: |
          git fetch --tags --force
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$tag" ]; then
            echo "No v* version tag found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows Installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          wails build -platform windows/amd64 -nsis -installscope user -clean -ldflags "-X main.appVersion=$version"
          Move-Item "build/bin/ytdlpgo-amd64-installer.exe" "build/bin/ytdlpgo-$version-windows-amd64-installer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/bin/*windows-amd64-installer.exe
          if-no-files-found: error

  macos:
    name: macOS Installers
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build macOS app
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          wails build -platform darwin/universal -clean -ldflags "-X main.appVersion=$VERSION"

      - name: Package DMG
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p build/dmg build/dist
          cp -R build/bin/ytdlpgo.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "ytdlpgo" -srcfolder build/dmg -ov -format UDZO \
            "build/dist/ytdlpgo-${VERSION}-macos-universal.dmg"
          rm -rf build/dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: build/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish to latest tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "ytdlpgo $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest

